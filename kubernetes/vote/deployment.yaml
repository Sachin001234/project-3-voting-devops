apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: project3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
        - name: vote
          image: application-vote:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
